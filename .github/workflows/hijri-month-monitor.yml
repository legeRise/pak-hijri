name: Pakistan Hijri month monitor

on:
  # GitHub cron is static. The Python guard exits before day 28 without calling Gemini.
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch:
    inputs:
      force_research:
        description: "Run Gemini research now even if the month is not due (safe test; never edits calendar files)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pak-hijri-month-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check elapsed days and research if due
        id: monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RESEARCH: ${{ inputs.force_research || false }}
        run: python3 scripts/monitor_hijri.py

      - name: Open pull request for validated update
        if: steps.monitor.outputs.action == 'update_month'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/hijri-update-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          YEAR="$(python3 -c 'import json; print(json.load(open("data/latest.json"))["hijri_year"])')"
          git add data/latest.json "data/$YEAR.json"
          if git diff --cached --quiet; then
            echo "No repository changes to propose."
            exit 0
          fi
          git commit -m "Update verified Pakistan Hijri month start"
          git push --force origin "$BRANCH"
          EXISTING_PR="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Update verified Pakistan Hijri month start" \
              --body "Generated by the scheduled monitor after research found a candidate official announcement. The Python safety checks require grounded trusted sources, a sequential month, and a plausible 29/30-day interval. Please verify the cited sources before merging."
          else
            echo "Updated existing PR #$EXISTING_PR."
          fi

      - name: Save research result for inspection
        if: always() && hashFiles('monitor-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hijri-monitor-result
          path: monitor-result.json
          retention-days: 14

      - name: Open a review issue when evidence is uncertain
        if: steps.monitor.outputs.action == 'needs_review' && github.event.inputs.force_research != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Pak Hijri monitor needs human review"
          EXISTING="$(gh issue list --state open --json title --jq '.[].title' | grep -Fx "$TITLE" || true)"
          if [ -z "$EXISTING" ]; then
            {
              echo "The scheduled monitor could not safely apply an update."
              echo
              echo "Review the attached hijri-monitor-result artifact from this workflow run."
              echo
              echo "Result JSON:"
              cat monitor-result.json
            } > /tmp/review-issue.md
            gh issue create --title "$TITLE" --body-file /tmp/review-issue.md
          else
            echo "An open review issue already exists; avoiding duplicate issues."
          fi
